<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Successful | Prime</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: 'Segoe UI', sans-serif;
        }

        /* SUCCESS CARD */
        .success-card {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
            animation: slideUp .6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CHECK ICON */
        .checkmark {
            font-size: 70px;
            color: #22c55e;
            animation: pop .5s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            80% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .brand {
            font-weight: bold;
            color: #2563eb;
            font-size: 22px;
        }

        .message {
            color: #6b7280;
        }

        /* BUTTONS */
        .btn-home {
            background: #2563eb;
            border: none;
        }

        .btn-home:hover {
            background: #1d4ed8;
        }

        .btn-orders {
            border: 2px solid #2563eb;
            color: #2563eb;
        }

        .btn-orders:hover {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="checkmark">✅</div>

        <div class="brand mt-2">Prime</div>

        <h3 class="mt-3">Payment Successful!</h3>

        <p class="message">
            Your order has been placed successfully.<br>
            Thank you for shopping with us.
        </p>

        <div class="d-grid gap-2 mt-4">
            {% if bill_id %}
            <a href="{% url 'download_bill' bill_id %}" class="btn btn-success border-0 px-4 py-2 fw-800">
                <i class="bi bi-file-earmark-arrow-down me-2"></i> Download Digital Invoice
            </a>
            {% endif %}

            <a href="{% url 'home' %}" class="btn btn-home text-white">
                🏠 Go to Home
            </a>

            <a href="{% url 'my_orders' %}" class="btn btn-orders">
                📦 View My Orders
            </a>

        </div>

    </div>

</body>

</html>
