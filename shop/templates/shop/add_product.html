{% extends 'shop/admin_base.html' %}
{% block content %}
<style>
    .admin-form-container {
        max-width: 800px;
        margin: 0 auto;
        background: #ffffff;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    .form-label {
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.5rem;
    }
    .form-control, .form-select {
        border-radius: 8px;
        border: 1px solid #d1d5db;
        padding: 0.75rem 1rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    .form-control:focus, .form-select:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    .btn-submit {
        background: #1e293b;
        color: white;
        font-weight: 600;
        padding: 0.75rem 2rem;
        border-radius: 8px;
        border: none;
        transition: background-color 0.2s;
    }
    .btn-submit:hover {
        background: #3b82f6;
        color: white;
    }
</style>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">Add New Product</h2>
        <a href="{% url 'admin_products' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Listings
        </a>
    </div>

    <div class="admin-form-container">
        <form method="POST" enctype="multipart/form-data" action="{% url 'add_product' %}">
            {% csrf_token %}
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Product Name *</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Premium Hammer">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" placeholder="e.g. Tools">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Brand</label>
                    <input type="text" name="brand" class="form-control" list="brand_list" placeholder="e.g. Cera">
                    <datalist id="brand_list">
                        {% for brand in brands %}
                        <option value="{{ brand.name }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Price (₹) *</label>
                    <input type="number" name="price" class="form-control" step="0.01" required placeholder="0.00">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Initial Stock Quantity *</label>
                    <input type="number" name="stock" class="form-control" required placeholder="0">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description *</label>
                <textarea name="description" class="form-control" rows="4" required placeholder="Enter product details..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Product Image</label>
                <input type="file" name="image" class="form-control" accept="image/*">
                <div class="form-text">Upload a clear image of the product. Max size 5MB.</div>
            </div>

            <div class="text-end">
                <button type="submit" class="btn-submit">Save Product <i class="bi bi-check-lg ms-1"></i></button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
