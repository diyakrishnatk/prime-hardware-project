<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Elite | Secure Access</title>

    <!-- Google Fonts: Inter & Space Grotesk for a high-tech corporate look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --bg-obsidian: #050505;
            --accent-neon: #3b82f6;
            /* Electric Blue */
            --accent-soft: #1d4ed8;
            --glass-white: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-high: #ffffff;
            --text-dim: #94a3b8;
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Space+Grotesk', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-obsidian);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--text-high);
        }

        /* ===== CYBER CORE BACKGROUND ===== */
        .cyber-bg {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            z-index: 0;
        }

        /* Moving laser line */
        .laser-line {
            position: absolute;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-neon), transparent);
            top: 50%;
            left: -100%;
            animation: scan 8s linear infinite;
            opacity: 0.3;
        }

        @keyframes scan {
            0% {
                left: -100%;
                top: 20%;
            }

            50% {
                left: 100%;
                top: 50%;
            }

            100% {
                left: -100%;
                top: 80%;
            }
        }

        /* ===== LOGIN ENGINE CARD ===== */
        .elite-card {
            position: relative;
            z-index: 10;
            width: 440px;
            padding: 3.5rem;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid var(--border-glass);
            border-radius: 4px;
            /* Crisp corporate corners */
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            animation: emerge 1.2s cubic-bezier(0.19, 1, 0.22, 1);
        }

        @keyframes emerge {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Subtle holographic border glow */
        .elite-card::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(45deg, transparent, var(--border-glass), var(--accent-neon), transparent);
            border-radius: inherit;
            z-index: -1;
            opacity: 0.6;
            animation: borderFlow 10s linear infinite;
        }

        @keyframes borderFlow {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 400% 50%;
            }
        }

        .elite-header {
            margin-bottom: 3rem;
            text-align: left;
        }

        .elite-logo-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .elite-logo {
            font-size: 1.5rem;
            color: var(--accent-neon);
            animation: pulse 4s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                filter: drop-shadow(0 0 5px var(--accent-neon));
            }

            50% {
                filter: drop-shadow(0 0 15px var(--accent-neon));
            }
        }

        .elite-header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin: 0;
            color: white;
            text-transform: uppercase;
        }

        .elite-header p {
            font-size: 0.825rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        /* ===== INPUT SYSTEM ===== */
        .field-group {
            margin-bottom: 2rem;
            position: relative;
        }

        .field-label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--accent-neon);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.75rem;
        }

        .field-control {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-glass);
            padding: 0.75rem 0;
            color: white;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        .field-control:focus {
            outline: none;
            border-color: var(--accent-neon);
            padding-left: 0.5rem;
        }

        .field-control::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }

        /* ===== ACTION BUTTON ===== */
        .btn-elite {
            width: 100%;
            padding: 1.25rem;
            background: var(--accent-neon);
            color: white;
            border: none;
            border-radius: 2px;
            font-size: 0.875rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        .btn-elite:hover {
            background: var(--accent-soft);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .btn-elite:active {
            transform: translateY(0);
        }

        .btn-elite::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.6s;
        }

        .btn-elite:hover::after {
            left: 100%;
        }

        /* ALERTS */
        .alert-elite {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
            padding: 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .elite-footer {
            margin-top: 3rem;
            text-align: left;
        }

        .elite-footer a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .elite-footer a:hover {
            color: var(--accent-neon);
        }

        /* Scroll decorative text */
        .scroll-text {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
            letter-spacing: 0.5em;
            writing-mode: vertical-rl;
        }
    </style>
</head>

<body>

    <div class="cyber-bg"></div>
    <div class="laser-line"></div>
    <div class="scroll-text">PRIME HARDWARE // SECURE ADMIN</div>

    <div class="elite-card">
        <div class="elite-header">
            <div class="elite-logo-wrapper">
                <i class="bi bi-cpu elite-logo"></i>
                <span style="font-size: 1rem; font-weight: 800; letter-spacing: 0.1em; color: var(--accent-neon);">PRIME
                    HARDWARE</span>
            </div>
            <h1>Login</h1>
            <p>Enter your credentials to continue</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <div class="field-group">
                <label class="field-label">Username</label>
                <input type="text" name="username" class="field-control" placeholder="Enter username" required autofocus
                    autocomplete="username">
            </div>

            <div class="field-group">
                <label class="field-label">Password</label>
                <input type="password" name="password" class="field-control" placeholder="Enter password" required
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn-elite">
                Log In
            </button>
        </form>

        {% if error_message %}
        <div class="alert-elite">
            <i class="bi bi-shield-slash-fill"></i>
            <span>Invalid username or password.</span>
        </div>
        {% endif %}

        <div class="elite-footer">
            <a href="/">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

</body>

</html>
