{% extends 'shop/admin_base.html' %}
{% block content %}

<style>
    :root {
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-border: rgba(255, 255, 255, 0.4);
        --card-radius: 22px;
        --accent-blue: #3b82f6;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --text-main: #1e293b;
        --text-muted: #64748b;
        --shadow-soft: 0 4px 20px -5px rgba(0, 0, 0, 0.05);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .intelligence-container {
        animation: fadeIn 0.5s ease-out forwards;
        max-width: 850px;
        margin: 0 auto;
    }

    .intel-form-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border-radius: var(--card-radius);
        border: 1px solid var(--glass-border);
        padding: 2.5rem;
        box-shadow: var(--shadow-soft);
    }

    .prod-context {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        margin-bottom: 2.5rem;
    }

    .context-viz {
        width: 60px;
        height: 60px;
        background: #eff6ff;
        color: var(--accent-blue);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        border: 1px solid rgba(59, 130, 246, 0.1);
    }

    .intel-label {
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.75rem;
    }

    .current-stock-stat {
        background: white;
        padding: 1.25rem;
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.03);
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .intel-input {
        width: 100%;
        padding: 0.85rem 1.25rem;
        border-radius: 14px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: white;
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--text-main);
        outline: none;
        transition: var(--transition);
    }

    .intel-input:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
    }

    .live-preview {
        background: white;
        padding: 1rem 1.5rem;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 2rem;
        border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .status-badge {
        padding: 0.5rem 1rem;
        border-radius: 10px;
        font-weight: 900;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .btn-save-intel {
        background: var(--text-main);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 15px;
        font-weight: 800;
        font-size: 0.95rem;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
    }

    .btn-save-intel:hover {
        background: var(--accent-blue);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2);
    }

    .btn-back-intel {
        background: rgba(0, 0, 0, 0.03);
        color: var(--text-main);
        padding: 1rem 2rem;
        border-radius: 15px;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.95rem;
        transition: var(--transition);
        display: inline-flex;
        align-items: center;
        width: auto;
    }

    .btn-back-intel:hover {
        background: rgba(0, 0, 0, 0.06);
    }
</style>

<div class="intelligence-container">
    <!-- PAGE HEADER -->
    <div class="mb-5">
        <h1 class="fw-black mb-1" style="letter-spacing: -1.5px; font-size: 2.25rem;">Inventory Adjustment</h1>
        <p class="text-muted fw-600">Precision control for warehouse stock levels</p>
    </div>

    <div class="intel-form-card">
        <div class="prod-context">
            <div class="context-viz"><i class="bi bi-cpu"></i></div>
            <div>
                <div class="intel-label">Adjustment Target</div>
                <h4 class="fw-black text-main mb-0">{{ product.name|title }}</h4>
            </div>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="intel-label">Stored Quantity</div>
                    <div class="current-stock-stat">
                        <i class="bi bi-hdd-stack text-muted fs-4"></i>
                        <div>
                            <div class="fw-black text-main h4 mb-0">{{ product.stock }}</div>
                            <div class="text-muted" style="font-size: 0.7rem;">Verified Units</div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="intel-label">Revised Quantity</div>
                    <input type="number" name="stock" value="{{ product.stock }}" class="intel-input" required>
                </div>

                <div class="col-12">
                    <div class="live-preview">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-soundwave text-primary"></i>
                            <span class="fw-800 text-main" style="font-size: 0.85rem;">Status Simulation:</span>
                        </div>
                        <div id="stockStatus"></div>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-3 mt-5">
                <a href="{% url 'admin_products' %}" class="btn-back-intel">Discard</a>
                <button type="submit" class="btn-save-intel">
                    <i class="bi bi-shield-check"></i> Commit Adjustment
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    const input = document.querySelector("input[name='stock']");
    const status = document.getElementById("stockStatus");

    function updateStatus() {
        let val = parseInt(input.value) || 0;
        if (val <= 5) {
            status.innerHTML = '<span class="status-badge" style="background: #fef2f2; color: #dc2626;"><i class="bi bi-circle-fill me-2" style="font-size:6px;"></i> CRITICAL</span>';
        } else if (val <= 20) {
            status.innerHTML = '<span class="status-badge" style="background: #fffbeb; color: #d97706;"><i class="bi bi-circle-fill me-2" style="font-size:6px;"></i> MODERATE</span>';
        } else {
            status.innerHTML = '<span class="status-badge" style="background: #ecfdf5; color: #059669;"><i class="bi bi-circle-fill me-2" style="font-size:6px;"></i> OPTIMAL</span>';
        }
    }

    input.addEventListener("input", updateStatus);
    updateStatus();
</script>

{% endblock %}
